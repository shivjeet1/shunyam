syntax = "proto3";

package shunya.v1;

option go_package = "shunya/proto/shunya/v1";

// ---------------------------------------------------------
// Device Service
// ---------------------------------------------------------

service DeviceService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message Device {
  string id = 1;
  string class = 2;
  string model = 3;
  string serial = 4;
  string firmware = 5;
  uint64 capacity_bytes = 6;
  repeated string supported_methods = 7;
  bool is_system_disk = 8;
  bool is_boot_medium = 9;
}

// ---------------------------------------------------------
// Job Service
// ---------------------------------------------------------

service JobService {
  // Generate a random physical presence challenge for a specific device
  rpc GetChallenge(GetChallengeRequest) returns (GetChallengeResponse);

  // Start a sanitization/wipe job on a specific device
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  
  // Stream progress events of an ongoing job
  rpc StreamEvents(StreamEventsRequest) returns (stream JobEvent);
}

message GetChallengeRequest {
  string device_id = 1;
}

message GetChallengeResponse {
  string challenge_string = 1; // e.g., "WIPE-9421"
}

message StartJobRequest {
  string device_id = 1;
  string challenge_response = 2; // User must provide the exact challenge_string
  string requested_method = 3;
}

message StartJobResponse {
  string job_id = 1;
}

message StreamEventsRequest {
  string job_id = 1;
}

message JobEvent {
  string job_id = 1;
  string step_name = 2;
  float progress_percent = 3;
  string status = 4;
  string message = 5;
}

// ---------------------------------------------------------
// Recovery Service
// ---------------------------------------------------------
service RecoveryService {
  rpc StartRecovery(StartRecoveryRequest) returns (StartRecoveryResponse);
}

message StartRecoveryRequest {
  string source_device_id = 1;
  string output_directory = 2;
  string profile = 3;
}

message StartRecoveryResponse {
  string job_id = 1;
}

// ---------------------------------------------------------
// Certificate Service
// ---------------------------------------------------------
service CertificateService {
  rpc GetCertificate(GetCertificateRequest) returns (GetCertificateResponse);
  
  // Verify certificate from a wiped drive
  rpc VerifyCertificate(VerifyCertificateRequest) returns (VerifyCertificateResponse);
}

message GetCertificateRequest {
  string job_id = 1;
}

message GetCertificateResponse {
  string cert_json = 1;
  bytes pdf_data = 2;
  string qr_payload = 3;
}

message VerifyCertificateRequest {
  string device_id = 1;
}

message VerifyCertificateResponse {
  bool is_valid = 1;
  string manifest_json = 2;
  string error_message = 3;
}
