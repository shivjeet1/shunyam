[package]
name = "shunya-cert"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
image = "0.25.10"
lopdf = "0.45.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }
pcsc = "2.9.0"
qrcode = "0.14.1"
rsa = "0.9.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.8"
signature = "2.2.0"
thiserror = "2.0.21"
x509-parser = "0.16.0"

[dev-dependencies]
rand = "0.8.5"
